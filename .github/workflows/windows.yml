name: Check Windows browser

on:
  push:
    branches: [main]
    paths:
      - scripts/smoke.cjs
      - .github/workflows/windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-browser:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Electron runtime
        run: npm exec -- install-electron --no

      - name: Test address handling
        run: npm test

      - name: Test the browser on Windows
        run: npm run test:e2e

      - name: Build portable browser and per-user installer
        if: github.event_name == 'workflow_dispatch'
        run: npm exec -- electron-builder --win nsis portable --x64 --publish never

      - name: Verify installation and removal as a standard Windows user
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/verify-windows-installer.ps1 -InstallerPath 'dist/Mini-Browser-Setup-User-Windows-x64.exe'

      - name: Upload Windows downloads
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Browser-Windows
          path: |
            dist/Mini Browser *.exe
            dist/Mini-Browser-Setup-User-Windows-x64.exe
          if-no-files-found: error
