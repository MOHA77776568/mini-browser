name: Build Windows release assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-windows.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and attach Windows downloads to
        required: true
        default: v1.0.1
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.release_tag || 'v1.0.1' }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.1' }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || 'v1.0.1' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Electron runtime
        run: npm exec -- install-electron --no

      - name: Test address handling
        run: npm test

      - name: Test the browser on Windows
        run: npm run test:e2e

      - name: Build portable app and installer
        run: npm exec -- electron-builder --win portable nsis --x64 --publish never

      - name: Prepare release downloads and checksums
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          Copy-Item -LiteralPath "dist/Mini Browser $version.exe" -Destination 'dist/Mini-Browser-Windows-x64.exe'
          Copy-Item -LiteralPath "dist/Mini Browser Setup $version.exe" -Destination 'dist/Mini-Browser-Setup-Windows-x64.exe'
          $assets = @('Mini-Browser-Windows-x64.exe', 'Mini-Browser-Setup-Windows-x64.exe')
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath (Join-Path 'dist' $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          $checksums | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding ascii

      - name: Attach downloads to the existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @('dist/Mini-Browser-Windows-x64.exe', 'dist/Mini-Browser-Setup-Windows-x64.exe', 'dist/SHA256SUMS.txt')
          & gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "GitHub release upload failed with exit code $LASTEXITCODE" }

      - name: Save Windows downloads as workflow artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Browser-Windows-${{ github.run_id }}
          path: |
            dist/Mini-Browser-Windows-x64.exe
            dist/Mini-Browser-Setup-Windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: ignore

      - name: Save browser test screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Browser-Windows-Screenshots-${{ github.run_id }}
          path: artifacts/*.png
          if-no-files-found: ignore
